# 穿云 · 默认品牌配置（开源发行版）
#
# 这是编译进二进制的缺省值。部署方可以复制本文件为 brand/company.toml 并在构建时
# 指定 CHUANYUN_BRAND=brand/company.toml，让同事拿到安装包即可登录、无需填服务器地址。
# 注意：brand/*.toml（default.toml 除外）已被 .gitignore 排除，私有配置不会进仓库。
#
# 运行时优先级：用户在界面里的设置 > 编译内嵌的品牌 > 这里的缺省值。

# 产品名（界面标题、日志前缀）
product_name = "穿云"

# 默认服务器控制通道地址。开源版留占位示例，用户首次登录时自行填写。
default_server = ""

# 服务端自签证书的 SPKI-SHA256 指纹（十六进制，冒号可选）。
# 留空 = 首次连接时弹出指纹确认对话框（TOFU），确认后固化到本地配置；
# 内部构建填入真实指纹，同事就不会看到这个对话框。
tls_pin = ""

# 证书校验模式："pin"（默认，配合上面的 tls_pin/TOFU）或 "system"（走系统 CA，
# 适用于给控制端口配了正规证书的部署）。
tls_verify = "pin"

# 检查更新与下载页地址。留空则关闭更新检查。
update_url = ""
