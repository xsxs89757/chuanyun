name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 产物名里带版本号，安装脚本靠版本号拼文件名。
  # tag 和 Cargo.toml 对不上就会拼出一个 404 的地址，所以先卡住。
  version:
    name: 核对版本
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.v.outputs.number }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          NUM=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ -n "${GITHUB_REF_NAME:-}" ] && [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$NUM" ]; then
              echo "tag 是 $TAG，但 Cargo.toml 里写的是 $NUM——先对齐再发" >&2
              exit 1
            fi
          fi
          echo "number=$NUM" >> "$GITHUB_OUTPUT"
          echo "版本 $NUM"

  linux:
    name: 服务端（Linux 静态二进制）
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      # rustls 走 ring、rusqlite 走 bundled，musl 下不依赖任何系统库
      - run: cargo build --release -p cy-server --bin chuanyun-server --target x86_64-unknown-linux-musl
      - name: 打包
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/chuanyun-server dist/
          cp deploy/chuanyun-server.service deploy/nginx.conf.example dist/
          tar czf chuanyun-server-${{ needs.version.outputs.number }}-linux-x86_64.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: chuanyun-server-*-linux-x86_64.tar.gz

  macos:
    name: 客户端（macOS 通用包）
    needs: version
    # 免费的 x86_64 runner 已经没有了，所以在 arm64 机器上交叉编译两个架构再 lipo 合并。
    # 只有一台机器，产物路径也更简单。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/package-mac.sh --universal
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  windows:
    name: 客户端（Windows MSI）
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # runner 镜像目前自带 WiX 3.14。FireGiant 已经不再支持 v3，
      # 哪天镜像把它移除了，就在这里加一步显式安装固定版本，或者切到 WiX 4。
      - run: cargo install cargo-wix --locked
      # 两个条件缺一不可：
      # - 在包目录里跑：main.wxs 里的 SourceFile 是相对路径（wix\License.rtf、
      #   wix\Product.ico），WiX 按当前目录找它们；在仓库根目录跑会去找
      #   <root>/wix/，那里什么都没有
      # - 带 --package：cargo-wix 认出这是 workspace，不指定包名就拒绝干活
      - run: cargo wix --package cy-desktop --nocapture
        working-directory: crates/cy-desktop
      # cargo-wix 按包名命名（cy-desktop-…），改成跟另外两个产物一致的名字
      - name: 改名
        shell: bash
        run: |
          mkdir -p out
          mv target/wix/*.msi "out/chuanyun-${{ needs.version.outputs.number }}-windows-x86_64.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*.msi

  release:
    name: 发布
    needs: [version, linux, macos, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 汇总产物并生成校验和
        run: |
          mkdir -p out
          find artifacts -type f -exec mv {} out/ \;
          # 安装脚本也发成 release 资产：raw.githubusercontent.com 在国内
          # 服务器上常年不通，而 releases/…/download 会跳到
          # objects.githubusercontent.com，那个通。文档里主推的就是这条地址。
          cp scripts/install-server.sh out/
          # 先写到别处再挪进来，否则 sha256sum * 会把正在写的 SHA256SUMS 自己也算进去
          (cd out && sha256sum -- *) > SHA256SUMS
          mv SHA256SUMS out/
          ls -lh out/
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body: |
            ## Server (Linux)

            ```
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install-server.sh \
              | sudo sh -s -- --domain t.example.com
            ```

            Downloads, installs, registers a systemd service, and prints the next
            four steps (DNS, firewall, nginx, first credential). Re-run it to upgrade.
            Full guide: [docs/deploy.md](https://github.com/${{ github.repository }}/blob/main/docs/deploy.md)

            一条命令装完，脚本会把接下来该做的四件事（解析、放行端口、nginx、发凭证）
            打在屏幕上。再跑一次就是升级。中文说明见
            [docs/部署.md](https://github.com/${{ github.repository }}/blob/main/docs/部署.md)。

            ## Desktop client

            Download the installer for your system below.
            It is **not code-signed**, so the first launch needs one extra step:

            - **macOS** — right-click the app icon → Open → Open. Double-clicking is blocked.
            - **Windows** — on the SmartScreen prompt, click "More info" → "Run anyway".

            Once per machine.

            没有购买代码签名证书，所以第一次打开要多一步：macOS 右键图标 → 打开 → 再点「打开」；
            Windows 在 SmartScreen 提示时点「更多信息」→「仍要运行」。每台机器做一次就好。

            ## Verify / 校验

            ```
            sha256sum -c SHA256SUMS --ignore-missing
            ```
