name: Publish vite plugin

# 插件和主程序的版本节奏不一样，所以用自己的 tag：plugin-v0.1.0
# 主程序发版用 v0.1.0，两者互不打扰。
on:
  push:
    tags: ["plugin-v*"]
  workflow_dispatch:

permissions:
  contents: read
  # 走 npm 的 Trusted Publishing（OIDC）：这条权限让 Actions 能换取一次性凭据，
  # 仓库里因此不需要存任何 npm 令牌——没有长期令牌可偷，也不受 2FA 拦截。
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/vite-plugin-chuanyun
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing 需要 npm 11.5.1 以上，runner 自带的版本可能不够
      - run: npm install -g npm@latest
        working-directory: .

      - run: npm ci || npm install

      # 先跑测试再发布：一旦发出去就撤不回来了（npm 只允许 72 小时内 unpublish，
      # 而且撤回过的版本号不能再用）
      - run: npm test

      - name: 核对 tag 与 package.json 的版本
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#plugin-v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag 是 $TAG，但 package.json 里写的是 $PKG——先对齐再发"
            exit 1
          fi

      # 不需要 NODE_AUTH_TOKEN，也不需要 --provenance：
      # 走 Trusted Publishing 时 npm 会自动生成来源证明。
      - run: npm publish
