[graph]
all-features = true

[advisories]
version = 2
# 下面两个都是「作者宣布不再维护」的提醒，不是漏洞，而且都是 Slint 拉进来的
# 传递依赖，我们这边改不动。等 Slint 换掉它们就会自动消失。
# 每次升级 Slint 之后可以把这两条注释掉试试，能过就删。
ignore = [
    # paste：宏辅助库，作者已归档仓库
    "RUSTSEC-2024-0436",
    # rustybuzz：文字塑形，Slint 的 femtovg 渲染器在用
    "RUSTSEC-2026-0206",
    # ttf-parser：字体解析，同上
    "RUSTSEC-2026-0192",
]

[licenses]
version = 2
# 项目本体是 Apache-2.0；依赖只接受同样宽松、可商用的许可。
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    # Boost 软件许可，宽松无附加义务（arboard 在 Windows 上的剪贴板依赖用它）
    "BSL-1.0",
    # 公共领域声明（ksni——Slint 在 Linux 上实现托盘图标用的库）
    "Unlicense",
    # BSD 风格（libfuzzer-sys，只在测试依赖里出现，不进产物）
    "NCSA",

    # Slint 提供「GPLv3 / Royalty-Free / 商业」三选一，我们选 Royalty-Free：
    # 桌面应用可免费分发（含商用），义务是在「关于」页展示归属（已实现）。
    # 在这里列出它，等于让依赖审计本身记录下我们选了哪一个——
    # 而不是笼统地放行 GPL-3.0，那会让人误以为本项目受 GPL 传染。
    # 详见 THIRD-PARTY.md。
    "LicenseRef-Slint-Royalty-free-2.0",
]
confidence-threshold = 0.9

[bans]
# 依赖树里同一个 crate 出现多个版本很常见（尤其是 GUI 那一大片），
# 提醒一下就好，不至于拦住构建。
multiple-versions = "warn"
# 不写版本号的依赖要拦——除了 workspace 内部互相引用的那几个路径依赖，
# 它们本来就没有版本可言。
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
