[package]
name = "cy-desktop"
description = "穿云桌面客户端（Slint）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "chuanyun"
path = "src/main.rs"

[dependencies]
cy-core.workspace = true
cy-proto.workspace = true

slint.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
toml.workspace = true
auto-launch.workspace = true
qrcode.workspace = true
directories.workspace = true
arboard = "3.6.1"

# 点 Dock 图标把窗口叫回来。winit 不处理 reopen 回调，得自己往 delegate 上挂。
# 版本跟 Slint 的 winit 后端一致，不会多引一份。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"] }

[build-dependencies]
slint-build.workspace = true

# 安装向导本身（欢迎页、按钮、许可证页）走 WiX 自带的简体中文文案；
# 不写这一行 cargo-wix 默认 en-US，界面英文、我们自己的中文字符串照样能正常显示。
[package.metadata.wix]
culture = "zh-CN"
