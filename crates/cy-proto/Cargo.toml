[package]
name = "cy-proto"
description = "穿云协议层：控制消息、数据流头、错误码、命名规则"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# 以下只有 codec / mux feature 才需要——只读协议定义的使用方不用背这些依赖
tokio-util = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
yamux = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "time"] }

[features]
default = []
# 控制流的 JSON Lines 编解码
codec = ["dep:tokio-util", "dep:futures"]
# yamux 多路复用驱动（服务端与客户端共用同一份）
mux = ["dep:tokio-util", "dep:futures", "dep:tokio", "dep:yamux", "dep:tracing"]
